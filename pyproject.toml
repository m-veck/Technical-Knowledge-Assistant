[project]
name = "tka"
version = "0.1.0"
description = "Technical Knowledge Assistant: answers LangChain questions from the FreshStack corpus"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
    "typer>=0.29.1",
]

# Registers the `tka` command: it calls `app` in src/tka/cli.py
[project.scripts]
tka = "tka.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
